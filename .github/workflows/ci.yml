name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  check:
    name: Python 3.14
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4.4.0
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@v31.11.1

      - name: Lint, test, and build in nix-shell
        run: nix-shell --run 'make check'
